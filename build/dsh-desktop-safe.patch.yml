# Recovery composition: keep only Desktop branding and the runtime adapter
# required by packaged Electron. Do not import the normal Desktop patch here:
# PPT, market installation and preset transfer must not block safe-mode boot.
- id: ui-brand-official
  disabled: true

- insert:
    - id: dsh-desktop-client-ui
      name: dsh-desktop-client-ui
    - id: dsh-desktop-hmr-fallback
      name: dsh-desktop-hmr-fallback
